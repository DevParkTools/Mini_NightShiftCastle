<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<title>야근의 성 - 퇴근 불가 액션</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05030a;touch-action:none;overscroll-behavior:none}
#stage{position:absolute;background:#000}
#stage canvas{position:absolute;left:0;top:0}
#game{image-rendering:pixelated;image-rendering:crisp-edges}
body{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#stage{overflow:hidden}
#ui{position:fixed;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none;touch-action:none}
#pad{z-index:5}
body.ui #pad{display:none!important}
#joy{position:absolute;bottom:max(3vmin,env(safe-area-inset-bottom));left:max(3vmin,env(safe-area-inset-left));width:calc(var(--b)*2.7);height:calc(var(--b)*2.7);border-radius:50%;border:2px solid rgba(180,170,255,.6);background:rgba(20,16,40,calc(var(--op,.55)*.7));pointer-events:auto;touch-action:none;display:none}
#jz{position:absolute;left:0;bottom:0;width:46%;height:62%;pointer-events:none;touch-action:none;display:none}
body.touch.float #jz{display:block;pointer-events:auto}
#joy.fl{bottom:auto}
#joy i{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(170,150,255,.7);border:2px solid #e6e0ff}
body.touch.stick #joy{display:block}
body.touch.stick .dp{display:none}
body.lh #joy,body.lh .dp{left:auto;right:max(2vmin,env(safe-area-inset-right))}
body.lh .ac{right:auto;left:max(2vmin,env(safe-area-inset-left))}
#pad{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;display:none;--b:clamp(46px,14vmin,78px)}
body.touch #pad{display:block}
.b{pointer-events:auto;touch-action:none;border:2px solid rgba(180,170,255,.55);background:rgba(20,16,40,var(--op,.55));color:#e6e0ff;border-radius:50%;font:bold calc(var(--b)*.26)/1 sans-serif;display:flex;align-items:center;justify-content:center;padding:0;margin:0}
.b.on{background:rgba(150,120,255,.65)}
.ac .b{flex-direction:column;gap:2px}.ac .b span{font-size:calc(var(--b)*.42);line-height:1}.ac .b small{font-size:calc(var(--b)*.19);font-weight:700;opacity:.9}
.mn .b{font-size:calc(var(--b)*.3)}
#ctx{position:absolute;display:none;left:50%;transform:translateX(-50%);bottom:calc(max(2vmin,env(safe-area-inset-bottom)) + var(--b)*2.9);width:auto;height:auto;padding:calc(var(--b)*.18) calc(var(--b)*.5);border-radius:calc(var(--b)*.5);background:rgba(110,80,230,.82);border-color:#e6e0ff;font-size:calc(var(--b)*.3);animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{transform:translateX(-50%) scale(1.08)}}
@media (orientation:portrait){#ctx{bottom:calc(max(2vmin,env(safe-area-inset-bottom)) + var(--b)*3.6 + 40px)}}
.dp,.ac{position:absolute;bottom:max(2vmin,env(safe-area-inset-bottom));display:grid;gap:5px}
.dp{left:max(2vmin,env(safe-area-inset-left));grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(2,var(--b))}
.ac{right:max(2vmin,env(safe-area-inset-right));grid-template-columns:repeat(2,var(--b));grid-template-rows:repeat(2,var(--b))}
.mn{position:absolute;left:50%;bottom:max(1.5vmin,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px}
.mn .b{width:calc(var(--b)*.92);height:calc(var(--b)*.56);border-radius:14px;font-size:calc(var(--b)*.2)}
@media (orientation:portrait){.mn{bottom:calc(max(2vmin,env(safe-area-inset-bottom)) + var(--b)*2 + 14px)}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="320" height="192"></canvas></div>
<canvas id="ui"></canvas>
<div id="pad">
<div id="jz"></div>
<div id="joy"><i></i></div>
<div class="dp">
<button class="b" data-k="up" style="grid-column:2;grid-row:1">▲</button>
<button class="b" data-k="left" style="grid-column:1;grid-row:2">◀</button>
<button class="b" data-k="down" style="grid-column:2;grid-row:2">▼</button>
<button class="b" data-k="right" style="grid-column:3;grid-row:2">▶</button>
</div>
<button class="b" id="ctx" data-k="up">▲ 상호작용</button>
<div class="mn">
<button class="b" data-k="menu" aria-label="메뉴">☰</button>
<button class="b" data-k="map" aria-label="지도">🗺️</button>
<button class="b" data-k="swap" aria-label="교체">🔄</button>
<button class="b" data-k="pot" aria-label="약">🧪</button>
<button class="b" data-k="eth" aria-label="마나">💧</button>
</div>
<div class="ac">
<button class="b" data-k="dash" style="grid-column:1;grid-row:1"><span>💨</span><small>대시</small></button>
<button class="b" data-k="sub" style="grid-column:2;grid-row:1"><span>✨</span><small>서브</small></button>
<button class="b" data-k="jump" style="grid-column:1;grid-row:2"><span>⏫</span><small>점프</small></button>
<button class="b" data-k="atk" style="grid-column:2;grid-row:2"><span>⚔️</span><small>공격</small></button>
</div>
</div>
<script>
(()=>{
'use strict';
const W=320,H=192,T=16,CW=20,CH=12,GW=10,GH=5,TW=GW*CW,TH=GH*CH;
const cv=document.getElementById('game'),g=cv.getContext('2d');
const uc=document.getElementById('ui'),u=uc.getContext('2d');
const stage=document.getElementById('stage');
const FONT='"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif';
const KEY='nocturne_keep_v1';
const GR=950,MF=380,RUN=92,JV=300,DJV=268,DASHV=330,DASHT=.28,CLIMB=54;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const lcg=s=>()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
const sgn=v=>v<0?-1:1;

const TD={
hall:{m:'in',a:'#0b0f20',b:'#1b2142',t1:'#3a4468',t2:'#202744',t3:'#6c78a8',l:'#6f8fe0',f:'arch'},
night:{m:'out',a:'#05061a',b:'#1b2250',t1:'#3a3a56',t2:'#1f1f30',t3:'#6a6a90',l:'#c8d4ff'},
library:{m:'books',a:'#1a0e07',b:'#321d0e',t1:'#5a3a22',t2:'#2c1a0e',t3:'#94683c',l:'#ffd890'},
catacomb:{m:'cave',a:'#08110d',b:'#15251d',t1:'#3c4a3f',t2:'#1c2822',t3:'#6c806d',l:'#9cd0a0'},
chapel:{m:'in',a:'#100820',b:'#25143f',t1:'#4e407a',t2:'#281e46',t3:'#8a76c4',l:'#c080ff',f:'glass'},
armory:{m:'in',a:'#180a0a',b:'#2e1616',t1:'#5a4040',t2:'#2c1c1c',t3:'#8e6a6a',l:'#ff9060',f:'banner'},
clock:{m:'gear',a:'#1a1206',b:'#35260e',t1:'#6a5224',t2:'#34260e',t3:'#b0903c',l:'#ffd060'},
garden:{m:'in',a:'#06140c',b:'#12301f',t1:'#2e5a3a',t2:'#16301f',t3:'#5cac6c',l:'#90ffb0',f:'glass2'},
sky:{m:'out',a:'#080d28',b:'#27376e',t1:'#4a5688',t2:'#252d54',t3:'#8e9cd8',l:'#d8e4ff'},
keep:{m:'in',a:'#1e0508',b:'#3e0c14',t1:'#6a2a34',t2:'#321016',t3:'#ac5060',l:'#ff4040',f:'banner'},
cistern:{m:'water',a:'#051318',b:'#0e2c36',t1:'#2e5864',t2:'#15303a',t3:'#5ca0b0',l:'#60e0f0'},
spire:{m:'in',a:'#0a0516',b:'#1d0f38',t1:'#493a70',t2:'#231a3c',t3:'#8a74c4',l:'#b070ff',f:'rune'},
sanct:{m:'in',a:'#10041a',b:'#2a0a40',t1:'#5a3a80',t2:'#2a1a44',t3:'#a870d8',l:'#ff80ff',f:'rune'}
};
const SHIFT={hall:0,night:-2,library:2,catacomb:-4,chapel:3,armory:-1,clock:5,garden:1,sky:4,keep:-5,cistern:-3,spire:6,sanct:7};
const TS={},BG={};
let GLOW,VIG;

let AC=null,mg,bgG,sg,nb,muted=false,trk='none',seqT=0,seqI=0,tShift=0;
const TRK={
castle:{bpm:84,roots:[45,41,38,40],q:['m','M','m','M'],mel:[[81,0,0,76,0,0,79,76],[77,0,0,72,0,0,74,72],[74,0,0,77,0,0,81,77],[80,0,0,76,0,0,71,0]],arp:[0,1,2,3,2,1,2,1],boss:false},
boss:{bpm:152,roots:[45,46,45,40],q:['m','M','m','M'],mel:[[81,0,81,0,84,0,83,0],[82,0,82,0,86,0,84,0],[81,0,81,0,84,0,88,0],[80,0,83,0,86,0,83,80]],arp:[0,2,1,3,0,2,1,3],boss:true}
};
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
if(AC){if(AC.state==='suspended')AC.resume();return;}
try{
AC=new(window.AudioContext||window.webkitAudioContext)();
mg=AC.createGain();mg.gain.value=muted?0:.8;mg.connect(AC.destination);
bgG=AC.createGain();bgG.gain.value=.3;bgG.connect(mg);
sg=AC.createGain();sg.gain.value=.55;sg.connect(mg);
nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
seqT=AC.currentTime+.1;setInterval(seq,50);applyCfg();
}catch(e){AC=null;}
}
function tone(f,t,d,ty,v,dst,f2){
const o=AC.createOscillator(),gn=AC.createGain();
o.type=ty;o.frequency.setValueAtTime(f,t);
if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
o.connect(gn);gn.connect(dst);o.start(t);o.stop(t+d+.03);
}
function nz(t,d,v,dst,fq,q){
const s=AC.createBufferSource(),gn=AC.createGain(),fl=AC.createBiquadFilter();
s.buffer=nb;fl.type='bandpass';fl.frequency.value=fq||2000;fl.Q.value=q||.7;
gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
s.connect(fl);fl.connect(gn);gn.connect(dst);s.start(t);s.stop(t+d+.03);
}
function sfx(n){
if(!AC||muted)return;
const t=AC.currentTime;
try{switch(n){
case 'swing':nz(t,.12,.35,sg,1800,.8);break;
case 'hit':tone(220,t,.1,'square',.25,sg,70);nz(t,.06,.3,sg,900);break;
case 'clank':tone(900,t,.08,'square',.2,sg,600);nz(t,.05,.3,sg,3000);break;
case 'hurt':tone(300,t,.25,'sawtooth',.3,sg,80);break;
case 'jump':tone(300,t,.12,'square',.1,sg,560);break;
case 'dj':tone(450,t,.14,'square',.1,sg,900);break;
case 'dash':nz(t,.22,.4,sg,700,.5);break;
case 'kill':tone(180,t,.22,'sawtooth',.22,sg,40);nz(t,.18,.3,sg,500);break;
case 'pick':tone(660,t,.08,'triangle',.25,sg);tone(990,t+.08,.12,'triangle',.25,sg);break;
case 'chest':[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.14,'triangle',.25,sg));break;
case 'save':[392,523,659,784].forEach((f,i)=>tone(f,t+i*.09,.3,'sine',.3,sg));break;
case 'lvl':[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.08,.2,'square',.12,sg));break;
case 'boom':nz(t,.6,.7,sg,300,.3);tone(120,t,.5,'sawtooth',.3,sg,30);break;
case 'roar':tone(110,t,.9,'sawtooth',.3,sg,50);nz(t,.8,.3,sg,250,.4);break;
case 'fire':tone(500,t,.2,'sawtooth',.1,sg,150);break;
case 'relic':[392,494,587,784,988,1175].forEach((f,i)=>tone(f,t+i*.12,.5,'triangle',.28,sg));break;
case 'no':tone(160,t,.1,'square',.15,sg);break;
case 'brk':nz(t,.25,.5,sg,400,.4);break;
case 'sub':tone(700,t,.1,'square',.1,sg,300);break;
case 'coin':tone(1200,t,.06,'square',.12,sg);tone(1600,t+.05,.1,'square',.12,sg);break;
case 'freeze':tone(1400,t,.5,'sine',.25,sg,300);nz(t,.4,.2,sg,5000);break;
case 'thunder':nz(t,.9,.6,sg,200,.3);tone(70,t,.8,'sawtooth',.25,sg,30);break;
}}catch(e){}
}
function stepSnd(t,i,tk,sd){
const bar=(i>>3)&3,s=i&7,root=tk.roots[bar]+tShift;
const ch=[0,tk.q[bar]==='m'?3:4,7,12];
tone(mf(root+12+ch[tk.arp[s]]),t,sd*.9,'triangle',tk.boss?.2:.17,bgG);
if(tk.boss){tone(mf(root-12+((s&1)?12:0)),t,sd*.85,'sawtooth',.16,bgG);if(s%4===0)tone(130,t,.12,'sine',.5,bgG,40);if(s%4===2)nz(t,.09,.22,bgG,1800,.6);}
else{if(s%4===0)tone(mf(root-12),t,sd*3.6,'triangle',.4,bgG);if(s&1)nz(t,.03,.05,bgG,6000,.5);}
const m=tk.mel[bar][s];
if(m)tone(mf(m+tShift),t,sd*1.6,'square',.07,bgG);
}
function seq(){
if(!AC)return;
if(trk==='none'||muted||AC.state!=='running'){seqT=Math.max(seqT,AC.currentTime);return;}
if(seqT<AC.currentTime-.2)seqT=AC.currentTime;
const tk=TRK[trk],sd=60/tk.bpm/2;
while(seqT<AC.currentTime+.25){stepSnd(seqT,seqI,tk,sd);seqT+=sd;seqI++;}
}
function setTrack(n,sh){
sh=sh||0;
if(n===trk&&sh===tShift)return;
trk=n;tShift=sh;seqI=0;
if(AC)seqT=AC.currentTime+.05;
}
function setMute(v){cfg.mute=v?1:0;saveCfg();applyCfg();}

function mkTiles(d){
const c=mk(128,16),x=c.getContext('2d');
const f=(i,a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(i*16+a,b,w,h);};
const brick=i=>{f(i,0,0,16,16,d.t1);f(i,0,7,16,1,d.t2);f(i,0,15,16,1,d.t2);f(i,7,0,1,7,d.t2);f(i,15,8,1,7,d.t2);f(i,0,0,16,1,'rgba(255,255,255,.07)');f(i,0,8,16,1,'rgba(255,255,255,.05)');};
brick(0);
brick(1);f(1,3,2,3,2,d.t2);f(1,10,10,4,2,d.t2);f(1,2,11,2,1,d.t2);
brick(2);f(2,0,0,16,3,d.t3);f(2,0,3,16,1,d.t2);f(2,3,3,2,1,d.t3);f(2,11,3,3,1,d.t3);
f(3,0,0,16,4,d.t3);f(3,0,4,16,2,d.t2);f(3,2,6,2,3,d.t2);f(3,12,6,2,3,d.t2);
for(let k=0;k<4;k++)for(let r=0;r<8;r++){const w=Math.max(1,r>>1);f(4,k*4+2-(w>>1),8+r,w,1,r<2?'#f0f4ff':'#aab4cc');}
f(4,0,14,16,2,d.t2);
brick(5);f(5,0,0,16,16,'rgba(255,220,160,.14)');
[[6,1,1,4],[7,5,2,1],[8,5,1,3],[5,9,3,1],[4,10,1,4],[11,3,1,3],[12,6,3,1]].forEach(q=>f(5,q[0],q[1],q[2],q[3],'#e8ecff'));
f(6,0,0,16,16,'#15151f');
for(let k=0;k<4;k++)f(6,k*4+1,0,2,16,'#9a9ab0');
f(6,0,3,16,2,'#6a6a80');f(6,0,11,16,2,'#6a6a80');
return c;
}
function mkBG(d,seed){
const c=mk(320,192),x=c.getContext('2d'),r=lcg(seed);
const Rc=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h);};
const gr=x.createLinearGradient(0,0,0,192);gr.addColorStop(0,d.a);gr.addColorStop(1,d.b);x.fillStyle=gr;x.fillRect(0,0,320,192);
const arch=(cx,top,wd,ht,col)=>{const hw=wd/2;for(let j=0;j<ht;j++){const w2=j<hw?Math.floor(Math.sqrt(hw*hw-(hw-j)*(hw-j))):hw;x.fillStyle=typeof col==='function'?col(j):col;x.fillRect(cx-w2,top+j,w2*2,1);}};
const m=d.m;
if(m==='in'||m==='cave'||m==='water'){
for(let y=0;y<192;y+=16){Rc(0,y+7,320,1,'rgba(0,0,0,.22)');Rc(0,y+15,320,1,'rgba(0,0,0,.22)');for(let xx=((y>>4)&1)*8;xx<320;xx+=16)Rc(xx+7,y,1,7,'rgba(0,0,0,.22)');}
}
if(m==='in'){
for(let k=0;k<4;k++){
const cx=k*80+48;
if(d.f==='banner'){
Rc(cx-8,20,16,64,'#7a1c28');Rc(cx-8,20,16,3,'#c8a040');
for(let j=0;j<8;j++)Rc(cx-8+j,84+j,16-j*2,1,'#7a1c28');
Rc(cx-1,32,2,10,'#c8a040');Rc(cx-4,38,8,2,'#c8a040');
}else if(d.f==='rune'){
x.strokeStyle=d.l;x.globalAlpha=.4;x.lineWidth=1;
x.beginPath();x.arc(cx,70,18,0,7);x.stroke();x.beginPath();x.arc(cx,70,11,0,7);x.stroke();
for(let q=0;q<6;q++){const a=q*Math.PI/3;x.beginPath();x.moveTo(cx,70);x.lineTo(cx+Math.cos(a)*18,70+Math.sin(a)*18);x.stroke();}
x.globalAlpha=1;
}else{
arch(cx,26,30,64,'rgba(0,0,0,.55)');
const pal=d.f==='glass'?['#6a3ab8','#b83a78','#3a78b8']:d.f==='glass2'?['#2a8a4a','#4aaa6a','#8acaa0']:null;
x.globalAlpha=.6;arch(cx,29,24,58,pal?(j=>pal[(j>>3)%3]):d.l);x.globalAlpha=1;
Rc(cx-1,29,2,58,'rgba(0,0,0,.7)');Rc(cx-12,52,24,2,'rgba(0,0,0,.7)');
}
}
for(let k=0;k<4;k++){const cx=k*80;Rc(cx,0,16,192,'rgba(0,0,0,.4)');Rc(cx+2,0,3,192,'rgba(255,255,255,.05)');Rc(cx-2,0,20,6,'rgba(0,0,0,.5)');Rc(cx-2,186,20,6,'rgba(0,0,0,.5)');}
}else if(m==='cave'){
for(let k=0;k<5;k++)for(let j=0;j<3;j++){
const nx=k*64+24+((j&1)*32),ny=26+j*56;
Rc(nx,ny,14,16,'rgba(0,0,0,.55)');Rc(nx+3,ny+3,8,6,'#c4c9b4');Rc(nx+4,ny+5,2,2,'#000');Rc(nx+8,ny+5,2,2,'#000');Rc(nx+5,ny+9,4,2,'#aeb29e');
}
}else if(m==='water'){
Rc(0,24,320,6,'#1a3c48');Rc(0,24,320,1,'#3a7080');
Rc(0,140,320,52,'rgba(60,170,200,.1)');
for(let k=0;k<8;k++)Rc((k*47)%290,140+k*6,40,1,'rgba(160,230,255,.25)');
for(let k=0;k<4;k++)arch(k*80+40,60,36,70,'rgba(0,0,0,.35)');
}else if(m==='out'){
for(let i=0;i<90;i++)Rc((r()*320)|0,(r()*120)|0,1,1,'rgba(255,255,255,'+(.25+r()*.6).toFixed(2)+')');
const mgr=x.createRadialGradient(252,40,4,252,40,60);mgr.addColorStop(0,'rgba(200,215,255,.45)');mgr.addColorStop(1,'rgba(200,215,255,0)');

fillT(r.cx*CW+1,r.cy*CH+1,r.cw*CW-2,r.ch*CH-2,0);
r.locks.length=0;
}
for(const r of rooms){
const ox=r.cx*CW,oy=r.cy*CH;
for(const o of r.ops){
const k=o[0];
if(k==='b')fillT(ox+o[1],oy+o[2],o[3],o[4],1);

else if(k==='c')fillT(ox+o[1],oy+o[2],o[3],o[4],0);
else if(k==='L')r.locks.push([ox+o[1],oy+o[2],o[3],o[4]]);
}
}
for(const l of LINKS){
if(l[0]==='R'){
for(let y=l[3];y<l[3]+l[4];y++)for(let x=l[1]*CW+18;x<=l[1]*CW+21;x++)setT(x,l[2]*CH+y,0);
linkSet.add('R'+l[1]+','+l[2]);

linkSet.add('D'+l[1]+','+l[2]);

}

function moveX(e,dx){

else{const tx=Math.floor(e.x/T);for(let ty=t0;ty<=t1;ty++)if(solid(tAt(tx,ty))){e.x=(tx+1)*T;return true;}}

}
function moveY(e,dy,drop){
const py=e.y;e.y+=dy;
const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-.01)/T);
if(dy>=0){

}

}

p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
if(!p.nt&&solid(tAt(Math.floor((p.x+p.w/2)/T),Math.floor((p.y+p.h/2)/T))))p.life=0;

let pdn=null;

const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',KeyZ:'atk',KeyJ:'atk',KeyX:'jump',KeyK:'jump',Space:'jump',KeyC:'sub',KeyL:'sub',ShiftLeft:'dash',ShiftRight:'dash',KeyV:'dash',KeyI:'dash',KeyQ:'swap',KeyH:'pot',KeyB:'eth',Escape:'menu',KeyP:'menu',Enter:'menu',KeyM:'map',KeyN:'mute'};
